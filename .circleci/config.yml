version: 2.1

executors:
  default:
    working_directory: /home/circleci/project
    environment:
      DOCKER_BUILDKIT: "1"
    docker:
      - image: cimg/go:1.24.1-node

jobs:
  setup:
    executor: default
    steps:
      - checkout
      - restore_cache:
          name: Restore Yarn Package Cache
          keys:
            - yarn-packages-v1-{{ checksum "frontend/yarn.lock" }}
      - run:
          name: Install Frontend Dependencies
          command: cd frontend && yarn install --frozen-lockfile
      - run:
          name: Install API Dependencies
          command: cd api && go mod download
      - save_cache:
          name: Save Yarn Package Cache
          key: yarn-packages-v1-{{ checksum "frontend/yarn.lock" }}
          paths:
            - ~/.cache
      - persist_to_workspace:
          root: /home/circleci/project
          paths:
            - .

  lint:
    executor: default
    steps:
      - attach_workspace:
          at: /home/circleci/project
      - run:
          name: Prettier Frontend
          command: cd frontend && yarn prettier:check && echo -e "\033[0;32mPrettier passed"
      - run:
          name: ESLint
          command: |
            cd frontend && yarn lint && echo -e "\033[0;32mESLint passed"

  unit-test:
    executor: default
    steps:
      - attach_workspace:
          at: /home/circleci/project
      - run:
          name: Run unit tests
          command: |
            cd api && go test ./...

  build:
    executor: default
    steps:
      - attach_workspace:
          at: /home/circleci/project
      - setup_remote_docker:
          version: docker24
      - run:
          name: Build Docker image
          command: |
            docker build \
              --build-arg VERSION="${CIRCLE_TAG:-$CIRCLE_BRANCH}" \
              --build-arg REVISION="$CIRCLE_SHA1" \
              -t kjwardy/go-url .
      - run:
          name: Push Docker image
          command: |
            if [ "$CIRCLE_BRANCH" == "master" ]; then
              echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_LOGIN" --password-stdin
              docker push kjwardy/go-url
            fi

workflows:
  version: 2
  main-workflow:
    jobs:
      - setup
      - lint:
          requires:
            - setup
      - build:
          requires:
            - setup
      - unit-test:
          requires:
            - setup

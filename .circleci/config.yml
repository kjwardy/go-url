version: 2.1

executors:
  default:
    working_directory: /home/circleci/project
    environment:
      # Required by the Dockerfile's build cache mounts.
      DOCKER_BUILDKIT: "1"
    docker:
      # Provides the Go and Node.js toolchains used by validation jobs.
      - image: cimg/go:1.24.1-node

jobs:
  # Install dependencies once and share the prepared repository with later jobs.
  setup:
    executor: default
    steps:
      - checkout
      - restore_cache:
          name: Restore Yarn Package Cache
          keys:
            - yarn-packages-v1-{{ checksum "frontend/yarn.lock" }}
      - run:
          name: Install Frontend Dependencies
          command: cd frontend && yarn install --frozen-lockfile
      - run:
          name: Install API Dependencies
          command: cd api && go mod download
      - save_cache:
          name: Save Yarn Package Cache
          key: yarn-packages-v1-{{ checksum "frontend/yarn.lock" }}
          paths:
            - ~/.cache
      - persist_to_workspace:
          root: /home/circleci/project
          paths:
            - .

  # Verify frontend formatting and lint rules before publishing an image.
  lint:
    executor: default
    steps:
      - attach_workspace:
          at: /home/circleci/project
      - run:
          name: Prettier Frontend
          command: cd frontend && yarn prettier:check && echo -e "\033[0;32mPrettier passed"
      - run:
          name: ESLint
          command: |
            cd frontend && yarn lint && echo -e "\033[0;32mESLint passed"

  # Run the Go API test suite independently from frontend validation.
  unit-test:
    executor: default
    steps:
      - attach_workspace:
          at: /home/circleci/project
      - run:
          name: Run unit tests
          command: |
            cd api && go test ./...

  # Build and publish versioned and latest images after validation succeeds.
  build:
    executor: default
    steps:
      - attach_workspace:
          at: /home/circleci/project
      - setup_remote_docker:
          version: docker24
      - run:
          name: Build Docker image
          # Docker tags cannot contain slashes or colons.
          command: |
            IMAGE_TAG=$(printf '%s' "$CIRCLE_TAG" | tr '/:' '--')
            docker build \
              --build-arg VERSION="$CIRCLE_TAG" \
              --build-arg REVISION="$CIRCLE_SHA1" \
              -t "kjwardy/go-url:$IMAGE_TAG" \
              -t kjwardy/go-url:latest .
      - run:
          name: Push Docker image
          # Credentials are supplied through protected CircleCI environment variables.
          command: |
            IMAGE_TAG=$(printf '%s' "$CIRCLE_TAG" | tr '/:' '--')
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_LOGIN" --password-stdin
            docker push "kjwardy/go-url:$IMAGE_TAG"
            docker push kjwardy/go-url:latest

workflows:
  version: 2
  # Releases run only for Git tags; ordinary branch pushes are ignored.
  main-workflow:
    jobs:
      - setup:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
      - lint:
          requires:
            - setup
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
      - unit-test:
          requires:
            - setup
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
      - build:
          requires:
            - lint
            - unit-test
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/

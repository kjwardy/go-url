version: 2.1

executors:
  default:
    working_directory: /go/src/github.com/kjwardy/go-url
    docker:
      - image: circleci/golang:1.15-node

jobs:
  setup:
    executor: default
    steps:
      - checkout
      - restore_cache:
          name: Restore Yarn Package Cache
          keys:
            - yarn-packages-v1-{{ checksum "frontend/yarn.lock" }}
      - run:
          name: Install Frontend Dependencies
          command: cd /go/src/github.com/kjwardy/go-url/frontend && yarn install --frozen-lockfile
      - run:
          name: Install API Dependencies
          command: cd /go/src/github.com/kjwardy/go-url/api && go mod download
      - save_cache:
          name: Save Yarn Package Cache
          key: yarn-packages-v1-{{ checksum "frontend/yarn.lock" }}
          paths:
            - ~/.cache
      - persist_to_workspace:
          root: /go/src/github.com/kjwardy
          paths:
            - ./go-url

  lint:
    executor: default
    steps:
      - attach_workspace:
          at: /go/src/github.com/kjwardy
      - run:
          name: Prettier Frontend
          command: cd frontend && yarn prettier:check && echo -e "\033[0;32mPrettier passed"
      - run:
          name: ESLint
          command: |
            cd frontend && yarn lint && echo -e "\033[0;32mESLint passed"

  unit-test:
    executor: default
    steps:
      - attach_workspace:
          at: /go/src/github.com/kjwardy
      - run:
          name: Run unit tests
          command: |
            cd api && go test ./...

  build:
    executor: default
    steps:
      - attach_workspace:
          at: /go/src/github.com/kjwardy
      - setup_remote_docker:
          version: 19.03.13
      - run:
          name: Build Docker image
          command: |
            docker build -t kjwardy/go-url .
      - run:
          name: Push Docker image
          command: |
            if [ "$CIRCLE_BRANCH" == "master" ]; then
              echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_LOGIN" --password-stdin
              docker push kjwardy/go-url
            fi

workflows:
  version: 2
  main-workflow:
    jobs:
      - setup
      - lint:
          requires:
            - setup
      - build:
          requires:
            - setup
      - unit-test:
          requires:
            - setup
